name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the UIAccess build (the app that gets installed)
        shell: cmd
        run: >
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize+ /define:UIA
          /target:winexe /out:Screenshot-UIAccess.exe /win32manifest:app.uiaccess.manifest
          /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll
          Screenshot.cs

      - name: Compile Screenshot.exe (launcher with the UIAccess build embedded)
        shell: cmd
        run: >
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize+
          /target:winexe /out:Screenshot.exe /win32manifest:app.manifest
          /resource:Screenshot-UIAccess.exe,UIAccessBuild.exe
          /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll
          Screenshot.cs

      - uses: actions/upload-artifact@v4
        with:
          name: Screenshot
          path: Screenshot.exe

      - name: Publish as the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Screenshot.exe --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Screenshot.exe built from commit $GITHUB_SHA. Double-click it: first run does a one-time setup."
