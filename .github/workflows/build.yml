name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the commit this build is made from
        shell: bash
        run: printf '%s' "$GITHUB_SHA" > build.txt

      - name: Compile the UIAccess build (the app that gets installed)
        shell: cmd
        run: >
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize+ /define:UIA
          /target:winexe /out:Screenshot-UIAccess.exe /win32manifest:app.uiaccess.manifest /resource:build.txt,BuildId
          /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll
          src\*.cs

      - name: Compile the standard build (installed when administrator support is not wanted)
        shell: cmd
        run: >
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize+ /define:UIA
          /target:winexe /out:Screenshot-Standard.exe /win32manifest:app.manifest /resource:build.txt,BuildId
          /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll
          src\*.cs

      - name: Compile Screenshot-Installer.exe (launcher with both builds embedded)
        shell: cmd
        run: >
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize+
          /target:winexe /out:Screenshot-Installer.exe /win32manifest:app.manifest /resource:build.txt,BuildId
          /resource:Screenshot-UIAccess.exe,UIAccessBuild.exe
          /resource:Screenshot-Standard.exe,StandardBuild.exe
          /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll
          src\*.cs

      - uses: actions/upload-artifact@v4
        with:
          name: Screenshot-Installer
          path: Screenshot-Installer.exe

      - name: Publish as the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Screenshot-Installer.exe --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Screenshot-Installer.exe built from commit $GITHUB_SHA. Double-click it to install (with or without administrator support)."
